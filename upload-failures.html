<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传日志</title><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'">
<style>body{font:15px system-ui;margin:0;background:#f5f7fa;color:#263445}main{max-width:1400px;margin:32px auto;padding:0 20px}a{color:#2563eb}header{display:flex;justify-content:space-between;align-items:center}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:10px;border:1px solid #ccd5df;border-radius:8px;background:white}button{cursor:pointer}input{min-width:280px}.scroll{overflow:auto;background:white;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}td{overflow-wrap:anywhere}td:last-child{max-width:420px}#status{margin:16px 0}button:disabled{opacity:.5;cursor:default}</style>
<main><header><h1>上传日志</h1><a href="/dashboard">返回管理后台</a></header><p>按时间倒序保留服务端全部上传请求记录（成功、失败、清理）。分块编号从 1 开始显示，API 中从 0 开始。大小未知时显示“未知”。</p>
<div class="tools"><input id="search" placeholder="筛选已加载记录：文件名、上传 ID、错误"><select id="outcome"><option value="">全部结果</option><option value="success">成功</option><option value="failure">失败</option></select><select id="stage"><option value="">全部阶段</option><option value="initialize">初始化</option><option value="chunk">分块上传</option><option value="merge">合并</option><option value="upload">普通上传</option><option value="cleanup">清理</option></select><button id="refresh">刷新</button><button id="more" disabled>加载更多</button></div><div id="status" role="status"></div>
<div class="scroll"><table><thead><tr><th>时间</th><th>上传 ID</th><th>文件名</th><th>完整文件大小</th><th>阶段</th><th>分块 / 大小</th><th>渠道</th><th>来源</th><th>HTTP</th><th>结果 / 信息</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
function authHeaders(){
 try { const credentials=JSON.parse(localStorage.getItem('vuex')||'{}').credentials;
 return credentials ? {Authorization:'Basic '+credentials} : {}; } catch { return {}; }
}
const $=id=>document.getElementById(id);let records=[],cursor=null,busy=false;
function localFailures(){try{return JSON.parse(localStorage.getItem("upload-client-failures-v1")||"[]")}catch{return []}}
function allRecords(){const map=new Map();for(const r of [...records,...localFailures()])map.set(r.id,r);return [...map.values()].sort((a,b)=>b.time-a.time)}
const stages={initialize:'初始化',chunk:'分块上传',merge:'合并',upload:'普通上传',cleanup:'清理'};
function size(n){return n==null?'未知':n.toLocaleString()+' 字节 ('+(n/1024/1024).toFixed(2)+' MiB)'}
function render(){const q=$('search').value.toLowerCase(),stage=$('stage').value;const shown=allRecords().filter(r=>(!stage||r.stage===stage)&&(!$('outcome').value||(r.outcome||(r.status>=400?'failure':'success'))===$('outcome').value)&&(!q||[r.uploadId,r.fileName,r.error].some(v=>String(v||'').toLowerCase().includes(q))));$('rows').replaceChildren();for(const r of shown){const tr=document.createElement('tr');for(const v of [new Date(r.time).toLocaleString(),r.uploadId,r.fileName||'未知',size(r.fileSizeBytes),stages[r.stage]||r.stage,r.chunkIndex==null?'—':(r.chunkIndex+1)+' / '+size(r.chunkSizeBytes),r.channel,r.source==='browser'?'浏览器'+(r.synced===false?'（待补报）':''):'服务器',r.status,(r.error||'成功')+' · '+(r.durationMs??'未知')+' ms']){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}$('status').textContent='已加载 '+allRecords().length+' 条，显示 '+shown.length+' 条'+(!allRecords().length?'；暂无上传记录':'');$('more').disabled=busy||!cursor}
async function load(reset){if(busy)return;busy=true;$('more').disabled=true;$('refresh').disabled=true;$('status').textContent='正在加载…';try{const query=new URLSearchParams();if(!reset&&cursor)query.set('cursor',cursor);const response=await fetch('/api/manage/uploadFailures?'+query,{cache:'no-store',headers:authHeaders()});if(response.status===401){location.replace('/adminLogin');return}if(!response.ok)throw new Error('查询失败 HTTP '+response.status+'，请确认管理员认证');const data=await response.json();records=reset?data.records:[...records,...data.records];cursor=data.cursor;busy=false;render()}catch(e){render();$('status').textContent=e.message+'；本机失败记录 '+localFailures().length+' 条（服务器不可用时仍保留）'}finally{busy=false;$('refresh').disabled=false;$('more').disabled=!cursor}}
$('refresh').onclick=()=>load(true);$('more').onclick=()=>load(false);$('search').oninput=render;$('stage').onchange=render;$('outcome').onchange=render;load(true);setInterval(()=>{if(!cursor)load(true)},10000);
</script></html>
